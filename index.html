<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cute Reminder 💗</title>

  <style>
    /* =========================
       CSS
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #f04cf0,
        #e968ee,
        #e8d9ff
      );

      color: #65485a;
    }

    .card {
      width: 90%;
      max-width: 430px;

      padding: 40px 30px;

      text-align: center;

      background: rgba(255, 255, 255, 0.85);

      border-radius: 30px;

      box-shadow:
        0 20px 50px rgba(120, 70, 100, 0.2);

      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;

      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      color: #d717e9;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #987084;
      margin-bottom: 25px;
    }

    .reminder-box {
      background: #fff5f8;

      border: 2px solid #ffd5e4;

      border-radius: 20px;

      padding: 25px 20px;

      margin-bottom: 25px;

      transition: 0.3s;
    }

    .reminder-box:hover {
      transform: scale(1.03);
    }

    #reminder {
      font-size: 18px;
      line-height: 1.6;
      color: #754c62;

      transition: opacity 0.2s ease;
    }

    button {
      border: none;

      padding: 14px 24px;

      border-radius: 30px;

      background: #e00fe0;

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(210, 80, 130, 0.25);

      transition: 0.3s;
    }

    button:hover {
      background: #b91ce9;
      transform: translateY(-3px);
    }

    button:active {
      transform: scale(0.95);
    }

    .footer {
      margin-top: 25px;

      font-size: 13px;

      color: #a47c90;
    }

    /* Floating hearts */

    .heart {
      position: absolute;

      color: rgba(210, 80, 130, 0.45);

      font-size: 30px;

      animation: float 5s infinite ease-in-out;
    }

    .heart:nth-child(1) {
      left: 10%;
      top: 20%;
    }

    .heart:nth-child(2) {
      left: 85%;
      top: 15%;
      animation-delay: 1s;
    }

    .heart:nth-child(3) {
      left: 15%;
      top: 75%;
      animation-delay: 2s;
    }

    .heart:nth-child(4) {
      left: 85%;
      top: 75%;
      animation-delay: 3s;
    }

    .heart:nth-child(5) {
      left: 50%;
      top: 8%;
      animation-delay: 1.5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-30px) rotate(15deg);
      }
    }

    @media (max-width: 500px) {
      .card {
        padding: 35px 20px;
      }

      h1 {
        font-size: 28px;
      }

      #reminder {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Floating hearts -->
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>

  <!-- Main card -->
  <div class="card">

    <div class="icon">🌷</div>

    <h1>Hello dabi! 💕</h1>

    <p class="subtitle">
      I'm your annoying but cute reminder that....
    </p>

    <div class="reminder-box">
      <p id="reminder">
        You are doing better than you think. 🌸
      </p>
    </div>

    <button id="reminderBtn">
      Give me a reminder 💌
    </button>

    <p class="footer">
      Take a deep breath. You've got this. ♡
    </p>

  </div>

  <script>
    /* =========================
       JAVASCRIPT
    ========================= */

    const reminders = [
      "You are doing better than you think. 🌸",

      "Don't forget to drink some water today. 💧",

      "It's okay to rest. You don't have to be productive all the time. 🫶",

      "Someone is very proud of you. 💗",

      "You deserve kindness, especially from yourself. 🌷",

      "Take things one step at a time. ☁️",

      "Eat something yummy today. 🍓",

      "Don't forget to smile. Your smile is cute. 💕",

      "Whatever happens today, you'll get through it. 🌈",

      "You matter more than you realize. ❤️",

      "Reminder: you're someone's favorite person. 👀💗",

      "You deserve a good day today. 🌸"
    ];

    const reminderText = document.getElementById("reminder");
    const reminderButton = document.getElementById("reminderBtn");

    reminderButton.addEventListener("click", function () {

      const randomNumber =
        Math.floor(Math.random() * reminders.length);

      reminderText.style.opacity = "0";

      setTimeout(function () {

        reminderText.textContent =
          reminders[randomNumber];

        reminderText.style.opacity = "1";

      }, 200);

    });
  </script>

</body>
</html>
